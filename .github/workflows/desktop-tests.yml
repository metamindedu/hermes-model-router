name: Desktop plugin tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Syntax and all Desktop regressions
        shell: bash
        run: |
          node --check desktop/plugin.js
          node --test --test-reporter=tap tests/*.mjs
