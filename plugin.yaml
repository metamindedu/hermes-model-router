name: model-router
version: 0.6.0
requires_hermes: ">=0.22.5"
kind: standalone
description: "Profile model settings, default-on Heavy/Light task routing via native delegation, allowlisted profile routes, and runtime controls"
author: NewMetaW
provides_tools:
  - coding_route
provides_hooks:
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_tool_call
  - post_tool_call
  - subagent_start
  - subagent_stop
provides_middleware:
  - tool_execution
  - llm_request
requires_env: []
