name: model-router
version: 0.8.0
requires_hermes: ">=0.22.5"
kind: standalone
description: "Native model/profile delegation, automatic role introductions, optional AI role drafts, and profile model controls"
author: NewMetaW
provides_tools:
  - coding_route
provides_hooks:
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_tool_call
  - post_tool_call
  - subagent_start
  - subagent_stop
provides_middleware:
  - tool_execution
  - llm_request
requires_env: []
