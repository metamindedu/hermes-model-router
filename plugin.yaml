name: model-router
version: 0.9.0
requires_hermes: ">=0.23.1"
kind: standalone
description: "Native delegation visibility, opt-in Gateway-owned profile jobs, operator-separated permissions, and profile model controls"
author: NewMetaW
provides_tools:
  - coding_route
  - profile_task
provides_hooks:
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_tool_call
  - post_tool_call
  - subagent_start
  - subagent_stop
  - post_compaction

provides_middleware:
  - tool_execution
  - llm_request
requires_env: []
